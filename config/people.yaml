# Humans Milo can reach, and the interrupt budget for each one.
# Example values. Put real numbers in config/people.local.yaml (git-ignored); Milo reads that file first.
# max_step: highest ladder step Milo may use (lookup, owner_agent, slack, imessage, call)
# call_only_if: minimum urgency for a phone call
people:
  ben:
    name: Ben
    phone: "+15555550101"
    email: ben@example.com
    slack_user: ""          # Slack user ID (U...), see: pnpm tsx scripts/slack.ts users
